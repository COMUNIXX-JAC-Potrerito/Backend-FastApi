name: CI

on:
  push:
    branches: [master, develop]
  pull_request:

permissions:
  contents: read

jobs:
  calidad:
    runs-on: ubuntu-latest
    # PostgreSQL real (como Neon) para probar las migraciones con el motor de producción.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: comunix
          POSTGRES_PASSWORD: comunix
          POSTGRES_DB: migraciones
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U comunix" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql://comunix:comunix@localhost:5432/migraciones
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Instalar Python y dependencias
        run: |
          uv python install
          uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Formato
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest

      - name: Vulnerabilidades conocidas en dependencias
        run: |
          uv export --frozen --no-dev --no-hashes --no-emit-project -o requisitos.txt
          uvx pip-audit==2.10.1 -r requisitos.txt --no-deps --disable-pip
