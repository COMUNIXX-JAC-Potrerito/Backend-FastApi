# Configuración de Alembic (migraciones de la base de datos).
# La URL de la base NO va aquí: se lee de DATABASE_URL (ver migraciones/env.py).
# Guía de uso: docs/migraciones.md

[alembic]
script_location = %(here)s/migraciones
prepend_sys_path = .
path_separator = os
# Nombre de cada archivo: <número>_<descripción>.py (p. ej. 0003_agregar_columna.py)
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 60

[post_write_hooks]
# Formatea con ruff cada migración nueva que genera `alembic revision`.
hooks = ruff_fix, ruff_format
ruff_fix.type = module
ruff_fix.module = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
