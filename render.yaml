# Blueprint de Render: define el servicio del backend automáticamente.
# En Render: New + → Blueprint → conecta este repo → Render lee este archivo.
services:
  - type: web
    name: comunix-backend
    runtime: docker
    plan: free
    branch: master
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      # Estos 3 se rellenan a mano en el panel de Render (son secretos).
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # Proxies delante de la app: Cloudflare + balanceador de Render. Ver docs/despliegue.md.
      - key: PROXIES_CONFIABLES
        value: "2"
      # Cloudinary para adjuntos (multimedia/archivos). Formato:
      # cloudinary://<api_key>:<api_secret>@<cloud_name>
      - key: CLOUDINARY_URL
        sync: false
