# Blueprint de Render: define el servicio del backend automáticamente.
# En Render: New + → Blueprint → conecta este repo → Render lee este archivo.
services:
  - type: web
    name: comunix-backend
    runtime: docker
    plan: free
    branch: master
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      # Estos 3 se rellenan a mano en el panel de Render (son secretos).
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
